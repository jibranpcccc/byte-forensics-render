       nothing lands after the scene's tail.

       narration of the same scene. That is the defect class in EP14/EP15.

       ?t= all call the same function, so a still at t is reproducible.

      production size/tracking. Real builds inline FuseMono/FuseDisplay/
      FuseBlack as data URIs.

      ?t= both seek `vo.currentTime`, exactly as the shipped engine does.

:root{
  --ground:#0D1110; --panel:#121917; --panel-2:#0A0E0D;
  --ink:#F6F6F4; --dim:#6E7270; --dimmer:#4C514E;
  --hair:#3C4241; --hair-soft:#222A28;
  --gold:#F5C531; --gold-hot:#FFD75E; --gold-deep:#A87C0C;
  --red:#E12A27; --red-hot:#FF5A55;
  --cyan:#38D9E8; --cream:#E8E5DA;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,monospace;
  --display:"Anton","Haettenschweiler","Arial Narrow",sans-serif;
  --hero:"Archivo Black","Arial Black",sans-serif;
  --pad-x:150px; --pad-y:92px; --foot:196px; --rail:96px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050706}
body{
  position:relative;overflow:hidden;
  font-family:var(--mono);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* ---------- stage ---------- */
.stage{
  position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  background:var(--ground);transform-origin:center center;
  transform:translate(-50%,-50%) scale(1);
}
.stage::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 700px at 16% 2%,rgba(42,27,77,.55),transparent 62%),
    radial-gradient(800px 620px at 92% 98%,rgba(56,217,232,.10),transparent 62%),
    linear-gradient(180deg,rgba(13,17,16,0),rgba(5,7,6,.42));
}

/* ---------- ambient layers (driven from t, never from wall clock) ---------- */
#grid{position:absolute;inset:-192px;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(246,246,244,.030) 1px,transparent 1px),
    linear-gradient(90deg,rgba(246,246,244,.030) 1px,transparent 1px);
  background-size:96px 96px;will-change:transform}
#sweep{position:absolute;left:0;right:0;top:0;height:340px;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(56,217,232,.045) 42%,rgba(56,217,232,.045) 58%,transparent);
  will-change:transform}
#glow{position:absolute;left:0;top:0;width:1360px;height:1080px;z-index:0;
  pointer-events:none;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(245,197,49,.13),rgba(245,197,49,.045) 46%,transparent 74%);
  will-change:transform,opacity}
.stage::after{
  content:"";position:absolute;inset:0;z-index:60;pointer-events:none;
  box-shadow:inset 0 0 190px rgba(0,0,0,.42);
}

/* ---------- scenes ---------- */
.scene{
  position:absolute;inset:0;z-index:1;
  padding:var(--pad-y) var(--pad-x) var(--foot);
  display:none;flex-direction:column;gap:36px;
}
.scene.on{display:flex}
.inner{display:flex;flex-direction:column;gap:34px;flex:1;min-height:0}

/* the later scenes mirror their composition so consecutive scenes never read
   as the same template */
.scene[data-scene="3"] .col--art,
.scene[data-scene="5"] .col--art{order:-1}

/* ---------- header ---------- */
.kicker{display:flex;align-items:center;gap:14px;
  font-size:19px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:var(--dim)}
.kicker i{width:34px;height:3px;background:var(--gold);
  box-shadow:0 0 14px rgba(245,197,49,.55);flex:none}
.display{
  font-family:var(--display);font-weight:400;font-size:96px;line-height:.98;
  letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance;
}
.display em{font-style:normal;color:var(--gold)}
/* The word box must contain the glyphs. A transformed element is composited and
   clips content that overflows its own box, which showed up as flat-topped
   capitals on the last words of a line. */
.tw{display:inline-block;padding:.12em 0 .05em}

/* ---------- two column body ---------- */
.body{display:grid;grid-template-columns:1fr 1fr;gap:56px;
  flex:1;min-height:0;align-items:stretch}
.col{display:flex;flex-direction:column;gap:18px;min-width:0;min-height:0}
.col--art{align-items:center;justify-content:center}

/* ---------- art panel: a documented figure, not a floating drawing ---------- */
.artpanel{display:flex;flex-direction:column;align-items:stretch;gap:14px;
  width:100%;min-height:0;flex:1}
.figbar{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dimmer);padding-bottom:9px;border-bottom:1px solid var(--hair-soft)}
.figbar b{font-weight:700;color:var(--dim)}
/* figures recovered from the BYTE episodes label themselves in a face
   this episode does not embed; alias it so the type matches */
svg.art text{font-family:var(--mono)}
.figbox{position:relative;flex:1 1 auto;min-height:0;display:flex;
  align-items:center;justify-content:center}
.figbox::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:
    linear-gradient(var(--hair) 0 0) 0 0/16px 1px no-repeat,
    linear-gradient(var(--hair) 0 0) 0 0/1px 16px no-repeat,
    linear-gradient(var(--hair) 0 0) 100% 0/16px 1px no-repeat,
    linear-gradient(var(--hair) 0 0) 100% 0/1px 16px no-repeat,
    linear-gradient(var(--hair) 0 0) 0 100%/16px 1px no-repeat,
    linear-gradient(var(--hair) 0 0) 0 100%/1px 16px no-repeat,
    linear-gradient(var(--hair) 0 0) 100% 100%/16px 1px no-repeat,
    linear-gradient(var(--hair) 0 0) 100% 100%/1px 16px no-repeat}
.figbox::after{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(246,246,244,.16) 0 1px,transparent 1px 24px)}
.art{width:100%;height:100%;min-height:0;max-height:none}
.artcap{font-size:13px;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--dimmer);text-align:left;
  padding-top:9px;border-top:1px solid var(--hair-soft)}

/* ---------- decision ledger (hook scene: candidates ruled out, then the
   answer kept). Purely compositional — the frame is never empty. ---------- */
.ledger{display:flex;flex-direction:column;flex:1;min-height:0}
.ledger__bar{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dimmer);padding-bottom:9px;border-bottom:1px solid var(--hair-soft)}
.ledger__bar b{font-weight:700;color:var(--dim)}
.ledger__rows{display:flex;flex-direction:column;flex:1;min-height:0;
  justify-content:space-evenly}
.ledger__row{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:16px;
  padding:18px 22px;border-radius:8px;border-left:3px solid var(--hair);
  background:linear-gradient(90deg,rgba(246,246,244,.040),
    rgba(246,246,244,.008) 72%,transparent)}
.ledger__rank{font-family:var(--mono);font-size:13px;font-weight:700;
  letter-spacing:.12em;color:var(--dimmer)}
.ledger__name{position:relative;font-size:30px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--dim);line-height:1.15;
  width:max-content;max-width:100%}
/* the strike is driven by the beat's own progress, so it lands with the word */
.ledger__name .strike{position:absolute;left:-8px;right:-8px;top:54%;height:3px;
  background:var(--red-hot);transform:scaleX(0);transform-origin:left center;
  box-shadow:0 0 12px rgba(225,42,39,.45)}
.ledger__row--cyan{border-left-color:var(--cyan)}
.ledger__row--red{border-left-color:var(--red-hot)}
.ledger__row--gold{border-left-color:var(--gold);
  background:linear-gradient(90deg,rgba(245,197,49,.12),
    rgba(245,197,49,.02) 72%,transparent)}
.ledger__row--gold .ledger__name{color:var(--gold)}
.ledger__row--gold .ledger__rank{color:rgba(245,197,49,.75)}

/* ---------- stat cards ---------- */
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{flex:1 1 0;min-width:0;padding:22px 24px;border-radius:10px;border:3px solid var(--hair);
  background:linear-gradient(180deg,rgba(18,25,23,.92),rgba(10,14,13,.92))}
.stat__v{font-family:var(--hero);font-size:104px;line-height:.86;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;display:block}
.stat__u{font-size:22px;font-weight:700;letter-spacing:.1em;color:var(--dim);
  margin-left:8px}
.stat__l{display:block;margin-top:10px;font-size:15px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.stat--gold{border-color:rgba(245,197,49,.55)}
.stat--gold .stat__v{color:var(--gold)}
.stat--red{border-color:rgba(225,42,39,.55)}
.stat--red .stat__v{color:var(--red-hot)}
.stat--cyan .stat__v{color:var(--cyan)}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;justify-content:space-evenly;flex:1;gap:26px}
.bar{display:grid;grid-template-columns:170px 1fr 180px;align-items:center;gap:22px}
.bar__lab{font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);text-align:right}
.bar__track{position:relative;height:58px;border-radius:5px;
  background:rgba(246,246,244,.022);box-shadow:inset 0 0 0 1px var(--hair-soft);
  overflow:hidden}
/* quarter ticks: the bar is drawn to scale, so the scale is visible */
.bar__track::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,
    rgba(246,246,244,.11) 0 1px, transparent 1px 25%)}
.bar__fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:5px;
  background:linear-gradient(90deg,#232B29,#3C4241 55%,#6E7270);
  box-shadow:none}
.bar--gold .bar__fill{background:linear-gradient(90deg,var(--gold-deep),var(--gold) 55%,var(--gold-hot));
  box-shadow:0 0 22px rgba(245,197,49,.35)}
.bar--cyan .bar__fill{background:linear-gradient(90deg,#0E6C77,var(--cyan) 55%,#9BF1FA);
  box-shadow:0 0 22px rgba(56,217,232,.32)}
.bar--red .bar__fill{background:linear-gradient(90deg,#7A1512,var(--red) 55%,var(--red-hot));
  box-shadow:0 0 22px rgba(225,42,39,.32)}
.bar__val{font-family:var(--hero);font-size:56px;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;text-align:right}
.bar__val small{font-family:var(--mono);font-size:18px;font-weight:700;
  letter-spacing:.1em;color:var(--dim);margin-left:8px}

/* ---------- rows ---------- */
.rows{display:flex;flex-direction:column;gap:14px;flex:1;justify-content:space-evenly}
.row{
  position:relative;display:grid;grid-template-columns:64px 1fr 230px;
  align-items:center;gap:20px;padding:22px 26px;border-radius:10px;
  border:3px solid var(--hair);
  background:linear-gradient(180deg,rgba(18,25,23,.92),rgba(10,14,13,.92));
}
.row--gold{border-color:rgba(245,197,49,.5);
  box-shadow:0 0 34px rgba(245,197,49,.13)}
.row__rank{font-family:var(--mono);font-size:19px;font-weight:700;
  letter-spacing:.12em;color:var(--dimmer)}
.row__name{font-size:27px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  min-width:0;overflow-wrap:break-word}
.row__sub{display:block;margin-top:6px;font-size:15px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.row__val{font-family:var(--hero);font-size:64px;letter-spacing:-.03em;
  text-align:right;font-variant-numeric:tabular-nums;line-height:.9;
  min-width:0;overflow:hidden;white-space:nowrap}
/* a word is not a hero numeral: same face, sized to the column instead of
   blowing the card open. 31px is measured: BANDWIDTH is the longest value and
   overflows the 230px column at 34px once the embedded Archivo Black is used. */
.row__val--sm{font-size:31px;letter-spacing:.01em;line-height:1.05}
.row--gold .row__val{color:var(--gold)}

/* ---------- chain ---------- */
/* ---------- chain: three columns with a measured rule, not empty boxes ---------- */
.chain{display:flex;align-items:stretch;gap:0;flex:1;min-height:0}
.chain__node{position:relative;flex:1;display:flex;flex-direction:column;
  justify-content:flex-start;align-items:center;gap:12px;
  padding:32px 22px;border-radius:10px;border:3px solid var(--hair);
  background:linear-gradient(180deg,rgba(18,25,23,.92),rgba(10,14,13,.92));
  text-align:center}
/* A tall column needs a device inside it, not a void: a graduated stem down the
   centre reads as a measurement and fills the gap between title and label. */
.chain__node::after{content:"";flex:1 1 0;min-height:24px;width:9px;
  margin:6px auto 4px;border-left:1px solid rgba(246,246,244,.14);
  background:repeating-linear-gradient(180deg,rgba(246,246,244,.20) 0 1px,
    transparent 1px 18px)}
.chain__node b{font-family:var(--display);font-size:44px;letter-spacing:.02em;
  text-transform:uppercase;font-weight:400;line-height:1}
.chain__node span{font-size:14px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);
  padding-top:12px;border-top:1px solid var(--hair-soft);width:100%}
.chain__node--gold{border-color:var(--gold);box-shadow:0 0 30px rgba(245,197,49,.18)}
.chain__node--gold::after{border-left-color:rgba(245,197,49,.45);
  background:repeating-linear-gradient(180deg,rgba(245,197,49,.55) 0 1px,
    transparent 1px 18px)}
.chain__node--gold b{color:var(--gold)}
.chain__node--gold span{border-top-color:rgba(245,197,49,.35)}
.chain__arrow{width:46px;display:grid;place-items:center;color:var(--gold);
  font-size:26px;font-weight:700}

/* ---------- note card ---------- */
/* The card is sized to its copy, not stretched to the column, and its top edge
   sits on the same line as the figure's: a quote card that hugs three lines
   reads as written, one stretched to 470px reads as unfinished. */
.note{
  align-self:flex-start;flex:0 0 auto;display:flex;flex-direction:column;gap:20px;
  padding:38px 42px;border-radius:10px;background:var(--cream);color:#141714;
  border:3px solid #C9C5B5;transform:rotate(-.6deg);
  box-shadow:0 26px 60px rgba(0,0,0,.55)
}
.note h4{font-family:var(--display);font-size:40px;font-weight:400;
  text-transform:uppercase;letter-spacing:.01em;color:#0F120F;
  padding-bottom:18px;border-bottom:2px solid rgba(15,18,15,.20)}
/* ruled page: the entries are written onto lines that exist before the text
   lands, so the card is never a blank cream slab */
.note ul{list-style:none;display:flex;flex-direction:column;
  gap:0;flex:0 0 auto;justify-content:flex-start;padding:0;
  background:repeating-linear-gradient(180deg,transparent 0 43px,
    rgba(20,23,20,.105) 43px 44px)}
.note li{display:flex;gap:12px;font-size:22px;font-weight:600;line-height:44px;
  letter-spacing:.005em;align-items:baseline}
.note li::before{content:"—";color:var(--gold-deep);font-weight:800;flex:none}

/* ---------- closing chip ---------- */
.closing{display:flex;align-items:center;gap:16px;align-self:flex-start;margin-top:auto}
.chip{display:inline-flex;align-items:center;gap:12px;padding:13px 26px;
  border-radius:999px;border:1.5px solid var(--gold);
  background:rgba(245,197,49,.07);
  font-size:19px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold)}
.chip--cyan{border-color:var(--cyan);background:rgba(56,217,232,.07);color:var(--cyan)}
.chip--red{border-color:var(--red-hot);background:rgba(225,42,39,.08);color:var(--red-hot)}

/* ---------- source footer (lives inside the rail band) ---------- */
.src{position:absolute;left:var(--pad-x);bottom:62px;
  font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dimmer)}

/* ---------- bottom rail: the persistent horizontal spine ---------- */
#rail{position:absolute;left:0;right:0;bottom:0;height:var(--rail);z-index:0;
  pointer-events:none;border-top:1px solid rgba(246,246,244,.10);
  background:linear-gradient(180deg,rgba(5,7,6,0),rgba(5,7,6,.90) 62%)}
#ticks{position:absolute;left:50%;transform:translateX(-50%);bottom:58px;
  width:620px;height:2px;background:rgba(246,246,244,.13)}
#ticks .bt{position:absolute;top:-1px;width:1px;height:5px;background:rgba(246,246,244,.20)}
#ticks .tk{position:absolute;top:-8px;width:1px;height:18px;background:rgba(246,246,244,.34)}
#ticks .tkf{position:absolute;left:0;top:0;height:2px;width:0;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold));
  box-shadow:0 0 14px rgba(245,197,49,.5)}
#ticks .tkh{position:absolute;top:-8px;width:2px;height:18px;margin-left:-1px;left:0;
  background:var(--gold-hot);box-shadow:0 0 14px rgba(245,197,49,.95)}

/* ---------- chrome ---------- */
#bar{position:absolute;top:0;left:0;height:3px;z-index:55;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-hot));
  box-shadow:0 0 22px rgba(245,197,49,.35);width:0}
#wm{position:absolute;left:var(--pad-x);bottom:32px;z-index:55;
  font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(246,246,244,.20)}
#tc{position:absolute;right:var(--pad-x);bottom:60px;z-index:55;
  font-size:15px;font-weight:700;letter-spacing:.14em;color:var(--dim);
  font-variant-numeric:tabular-nums}
#subs{position:absolute;left:0;right:0;bottom:124px;z-index:56;
  display:flex;justify-content:center;pointer-events:none}
#sub-active{
  max-width:1450px;padding:9px 34px;border-radius:999px;
  background:rgba(13,17,16,.94);border:1.5px solid rgba(245,197,49,.4);
  box-shadow:0 8px 30px rgba(0,0,0,.85);
  font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.03em;
  color:rgba(246,246,244,.34);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.sub-word{transition:none}
.sub-word--on{color:var(--gold);font-weight:800;
  text-shadow:0 0 16px rgba(245,197,49,.85)}
#dip{position:absolute;inset:0;z-index:57;background:#050706;opacity:0;
  pointer-events:none}
#wipe{position:absolute;top:0;bottom:0;left:0;width:3px;z-index:59;opacity:0;
  pointer-events:none;
  background:linear-gradient(180deg,transparent 4%,var(--gold-hot) 34%,#FFF6D2 50%,var(--gold-hot) 66%,transparent 96%);
  box-shadow:0 0 40px 6px rgba(245,197,49,.35)}
#ctl{position:absolute;left:var(--pad-x);top:44px;z-index:58;
  display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer)}
#ctl button{font:inherit;color:var(--dim);background:rgba(18,25,23,.9);
  border:1px solid var(--hair);border-radius:6px;padding:7px 12px;cursor:pointer}
#ctl button:hover{color:var(--gold);border-color:rgba(245,197,49,.45)}
#ctl .badge{color:var(--gold);border:1px solid rgba(245,197,49,.35);
  border-radius:6px;padding:7px 12px}
/* engaged state: 2x must look engaged, not like a label that happens to say 2 */
#ctl button.on{color:var(--gold);border-color:rgba(245,197,49,.55);
  background:rgba(245,197,49,.12)}
/* tabular figures so the button does not resize between 1x and 2x */
#ctl #speed{min-width:54px;font-variant-numeric:tabular-nums}

/* ---------- voice level ---------- */
#ctl .vol{display:flex;align-items:center;gap:8px;padding:0 4px 0 2px}
#ctl .vol #vol{width:104px;height:3px;appearance:none;-webkit-appearance:none;
  background:var(--hair);border-radius:2px;outline:none;cursor:pointer;
  accent-color:var(--gold)}
#ctl .vol #vol::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;
  width:11px;height:11px;border-radius:50%;background:var(--gold);
  border:0;cursor:pointer}
#ctl .vol #vol::-moz-range-thumb{width:11px;height:11px;border-radius:50%;
  background:var(--gold);border:0;cursor:pointer}
#ctl .vol #mute{min-width:52px;font-variant-numeric:tabular-nums}
#ctl .vol #mute.on{color:var(--gold);border-color:rgba(245,197,49,.55);
  background:rgba(245,197,49,.12)}
/* the readout must not shift the row as the number changes width */
#ctl .vol #volval{min-width:44px;text-align:right;color:var(--dim);
  font-weight:700;font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------------------
   RENDER MODE = the final video frame, and NOTHING else.

   The operator's requirement, verbatim: "all the lower part and play part it
   should be clean no chapter names or runing time nothing needed on the final
   video".

   Before this block, render mode hid only #ctl. Everything below stayed in the
   frame and would have been baked into the exported video:

     #tc     the timecode, "00:00 / 09:34"      <- running time
     #wm     "BYTE FORENSICS"                    <- brand mark
     #rail   the bottom gradient spine on top of the caption bar
     #ticks  the segment tick strip + playhead   <- playback chrome
     #bar    the progress bar across the top     <- playback chrome

   What MUST stay: the scene content and #subs (the captions are part of the
   edit -- they are the words being spoken and are the reason the video is
   audio-locked). Nothing else.
   --------------------------------------------------------------------------- */
body.render #ctl{display:none}
body.render #tc{display:none}
body.render #wm{display:none}
body.render #bar{display:none}
body.render #ticks{display:none}
body.render #rail{display:none}
body.render #boot{display:none}
/* captions stay, but drop the pill so they sit clean on the picture */
body.render #sub-active{
  background:none;border-color:transparent;box-shadow:none;
  padding-left:0;padding-right:0}
/* the stage fills the frame exactly -- no letterbox, no gutter */
body.render{margin:0;overflow:hidden;background:#0D1110}

/* ---------- boot / failure banner (never a silent black screen) ---------- */
#boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;background:#050706;
  font-family:var(--mono);color:var(--ink);text-align:center;padding:40px}
#boot.hide{display:none}
#boot .boot__mark{font-family:var(--hero);font-size:34px;letter-spacing:.12em;color:var(--gold)}
#boot .boot__sub{font-size:13px;font-weight:700;letter-spacing:.24em;
  color:#6E7270;text-transform:uppercase}
#boot .boot__err{max-width:900px;margin-top:18px;font-size:15px;line-height:1.6;
  color:#FF5A55;white-space:pre-wrap;text-align:left}
/* the poster's only control: no transition, so nothing about this file depends
   on a wall clock even while it is on screen */
#boot .boot__play{font-family:var(--hero);font-size:21px;letter-spacing:.18em;
  padding:17px 46px;margin-top:12px;color:var(--gold);cursor:pointer;
  background:rgba(245,197,49,.10);border:1px solid rgba(245,197,49,.55);
  border-radius:8px;text-transform:uppercase}
#boot .boot__play:hover{background:rgba(245,197,49,.20);border-color:var(--gold)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="grid"></div>
  <div id="sweep"></div>
  <div id="glow"></div>
  <div id="rail"><div id="ticks"></div></div>
  <div id="wipe"></div>
  <div id="bar"></div>
  <div id="tc">00:00</div>
  <div id="ctl">
    <button id="play">PLAY</button>
    <button id="stop" title="Stop and rewind to the start (S)">STOP</button>
    <button id="speed" title="Cycle 1x / 2x / 4x — the audio stays the clock (X)">1×</button>
    <span class="vol" title="Voice level — the picture still follows the audio at any level">
      <button id="mute" aria-pressed="false" title="Mute / unmute the voice (M)">VOL</button>
      <input id="vol" type="range" min="0" max="100" step="1" value="100"
             aria-label="Voice level" title="Voice level">
      <b id="volval">100%</b>
    </span>
    <span class="badge">BYTE FORENSICS</span>
  </div>
  <div id="subs"><div id="sub-active"></div></div>
  <div id="wm">BYTE FORENSICS</div>
  <div id="dip"></div>
</div>

<div id="boot">
  <div class="boot__mark">BYTE FORENSICS</div>
  <div class="boot__sub">the memory bandwidth myth</div>
  <button id="bootplay" class="boot__play">PLAY</button>
  <div class="boot__err" id="booterr"></div>
</div>

const MIN_GAP = 0.30;   // no two arrivals closer than this
const TAIL    = 0.60;   // last element must land this far before the scene ends

function fail(msg){ throw new Error("[BUILD] " + msg); }

/* Anchor -> spoken time, resolved against the REAL WordBoundary times that TTS
   produced. No character weighting, no estimation. A phrase that is missing, or
   present twice, is a build error rather than a confidently wrong timestamp. */
function anchorTime(sc, phrase){
  const norm = s => String(s).toLowerCase().replace(/[^a-z0-9'\s]/g, " ").split(/\s+/).filter(Boolean);
  const needle = norm(phrase);
  if (!needle.length) fail("empty anchor @ scene " + sc.i);

  // Flatten to tokens, each remembering which spoken word it came from, so that
  // compounds like "Twenty-four" and "ninety-two" match as two tokens of one word.
  const flat = [];
  sc.words.forEach((w, wi) => norm(w.w).forEach(tk => flat.push({ tk: tk, wi: wi })));

  const hits = [];
  for (let i = 0; i + needle.length <= flat.length; i++){
    let ok = true;
    for (let k = 0; k < needle.length; k++)
      if (flat[i + k].tk !== needle[k]) { ok = false; break; }
    if (ok) hits.push(flat[i].wi);
  }
  if (!hits.length)  fail("anchor not spoken: " + JSON.stringify(phrase) + " @ scene " + sc.i);
  if (hits.length > 1) fail("anchor not unique (x" + hits.length + "): " + JSON.stringify(phrase) + " @ scene " + sc.i);
  return sc.words[hits[0]].t;
}

function build(){
  if (!TIMING || !TIMING.scenes) fail("no TIMING — run _make_sample_audio.py to inject it");
  if (TIMING.scenes.length !== SPEC.length)
    fail("timing has " + TIMING.scenes.length + " scenes, spec has " + SPEC.length);

  SPEC.forEach((sc, i) => {
    const ts = TIMING.scenes[i];
    sc.i = i;
    sc.s = ts.start;
    sc.e = ts.start + ts.dur;
    sc.words = ts.words.map(([t, w]) => ({ t: t, w: w }));
    // display text (original case + punctuation) is parallel to sc.words; it is
    // only ever drawn, never used for timing or anchoring
    sc.d = (ts.d && ts.d.length === sc.words.length) ? ts.d : null;
    if (Math.abs(ts.dur - sc.dur) > 1.2)
      console.warn("[DRIFT] scene " + i + ": spec declares " + sc.dur +
                   "s, audio is " + ts.dur.toFixed(2) + "s");

    // Collect elements, then ORDER THEM BY WHEN THE SCRIPT SPEAKS THEM.
    // Array order is authoring order, not timing order: an `art_at` late in
    // the sentence would otherwise drag every later element past the tail.
    const els = [];
    els.push({ id: "s" + i + "_hdr", kind: "rise", at: sc.header_at, pin: "first" });
    if (sc.art) els.push({ id: "s" + i + "_art", kind: "draw", at: sc.art_at });
    (sc.chips  || []).forEach((c, j) => els.push({ id: "s" + i + "_chip" + j, kind: "pop",  at: c.at }));
    (sc.stats  || []).forEach((c, j) => els.push({ id: "s" + i + "_stat" + j, kind: "slam", at: c.at, count: c }));
    (sc.bars   || []).forEach((c, j) => els.push({ id: "s" + i + "_bar"  + j, kind: "fill", at: c.at, fill: c, count: c }));
    (sc.rows   || []).forEach((c, j) => els.push({ id: "s" + i + "_row"  + j, kind: "rise", at: c.at }));
    (sc.chain  || []).forEach((c, j) => els.push({ id: "s" + i + "_node" + j, kind: "pop",  at: c.at }));
    (sc.note_items || []).forEach((c, j) => els.push({ id: "s" + i + "_li" + j, kind: "rise", at: c.at }));
    if (sc.closing) els.push({ id: "s" + i + "_close", kind: "pop",  at: sc.closing.at, pin: "last" });
    // NOTE: the source footer is a static citation, not a spoken beat. Giving it
    // an anchor made the rhythm law push it 5s past its word. It renders from
    // scene start and is deliberately absent from `beats`.

    // Resolve each anchor to a spoken time, then sort by that time.
    els.forEach(el => { el.raw = anchorTime(sc, el.at); });
    els.sort((a, b) => {
      if (a.pin === "first") return -1;
      if (b.pin === "first") return 1;
      if (a.pin === "last" && b.pin === "last") return a.id.endsWith("_src") ? 1 : -1;
      if (a.pin === "last") return 1;
      if (b.pin === "last") return -1;
      return a.raw - b.raw;
    });

    // Rhythm law: monotonic, minimum gap, must finish before the tail.
    let prev = sc.s - 999;
    els.forEach(el => {
      let t = Math.max(el.raw, sc.s + 0.05);
      t = Math.max(t, prev + MIN_GAP);          // never closer than MIN_GAP
      t = Math.min(t, sc.e - TAIL);             // never after the tail
      el.s = t;
      el.e = Math.min(t + { rise: .34, slam: .46, pop: .42, draw: .72, fill: .70 }[el.kind], sc.e);
      prev = t;
    });
    sc.beats = els;
    els.forEach(b => F.beats.push(b));
    F.scenes.push(sc);
    sc.w0 = F.words.length;
    sc.words.forEach(w => F.words.push([+w.t.toFixed(4), w.w]));
    sc.w1 = F.words.length;
  });

  F.total = TIMING.total;
  return F;
}

/* ============================================================================
   3. THE BINDING CHECK — the defect class in EP14/EP15
   ----------------------------------------------------------------------------
   Every numeral rendered in a card/bar/row/stat must exist in that scene's VO.
   Run at load; failures print to the console and are counted for the badge.
   ========================================================================== */

function check(){
  const problems = [];

  /* A numeral on screen must be spoken in the same scene. The voice says
     numbers as words, so each numeric element declares `spoken` — the exact
     phrase the narration uses. Same contract as a fact-sheet `spoken_as` row:
     the build fails if the phrase is absent. */
  F.scenes.forEach(sc => {
    const voiced = sc.vo.toLowerCase().replace(/[—–]/g, "-");
    const numEls = [];
    (sc.stats || []).forEach(c => numEls.push({ v: c.v + " " + c.u, spoken: c.spoken }));
    (sc.bars  || []).forEach(c => numEls.push({ v: c.val + " " + c.unit, spoken: c.spoken }));
    (sc.rows  || []).forEach(c => numEls.push({ v: c.val, spoken: c.spoken }));

    numEls.forEach(el => {
      const hasDigit = /\d/.test(el.v);
      if (!hasDigit) return;
      if (!el.spoken){
        problems.push("scene " + sc.i + " shows " + el.v + " with no spoken mapping");
        return;
      }
      if (!voiced.includes(el.spoken.toLowerCase()))
        problems.push("scene " + sc.i + " shows " + el.v + ' but never says "' + el.spoken + '"');
    });
  });

  // Every anchor must be an exact, unique substring — build() already throws,
  // this is the second, independent pass.
  F.scenes.forEach(sc => (sc.beats || []).forEach(b => {
    const n = sc.vo.toLowerCase().split(b.at.toLowerCase()).length - 1;
    if (n !== 1) problems.push("scene " + sc.i + " anchor x" + n + ": " + b.at);
  }));

  /* Arrival order must match reading order inside a list. `worstPush` only
     measures lateness, so a row that lands BEFORE the row above it passes every
     other check while reading as a bug on screen. Numbered siblings are grouped
     by id prefix and their scheduled times must increase with their index. */
  F.scenes.forEach(sc => {
    const groups = {};
    (sc.beats || []).forEach(b => {
      const m = /^(.*?)(\d+)$/.exec(b.id);
      if (!m) return;
      (groups[m[1]] = groups[m[1]] || []).push({ n: +m[2], s: b.s, id: b.id });
    });
    Object.keys(groups).forEach(k => {
      const g = groups[k].sort((a, b) => a.n - b.n);
      for (let i = 1; i < g.length; i++)
        if (g[i].s <= g[i - 1].s)
          problems.push("scene " + sc.i + ": " + g[i].id +
                        " lands at " + g[i].s.toFixed(2) + "s, before " + g[i - 1].id +
                        " at " + g[i - 1].s.toFixed(2) + "s");
    });
  });

  if (problems.length) console.warn("[BINDING] " + problems.length + " problem(s)\n" + problems.join("\n"));
  else console.log("[BINDING] 0 problems — every on-screen number is spoken in its scene.");
  return problems;
}

/* ============================================================================
   4. ART — flat stroked SVG, one accent, no gradients
   ----------------------------------------------------------------------------
   The figures move, but no layer here is animated by the browser. Rotation and
   translation are written as SVG transform ATTRIBUTES from animateArt(), which
   is called once per frame with the frame's own timestamp. Nothing here reads a
   clock, so a still at any t is reproducible and a seek lands on exactly the
   frame the piece would have had if it had played through.
   ========================================================================== */

const INK = "#F6F6F4", GOLD = "#F5C531", RED = "#E12A27", CYAN = "#38D9E8",
      HAIR = "#3C4241", BG = "#0D1110";

function svg(view, body, slug){
  return '<svg class="art" viewBox="' + view + '" fill="none" ' +
         'stroke-linecap="round" stroke-linejoin="round" data-art="' + slug + '">' +
         body + '</svg>';
}
const S = (w, c) => ' stroke="' + (c || INK) + '" stroke-width="' + (w || 3) + '"';





/* ============================================================================
   FIGURE PRIMITIVES  (lf_ = library figure)
   ----------------------------------------------------------------------------
   Shared vocabulary for the drawing library. Every figure is composed from
   these, so hundreds stay coherent and cannot drift off the design contract:
   one gold accent, 2:1 frame, safe margins, closed palette.

   Names are lf_-prefixed because the episode already declares `needle`.
   ========================================================================== */
var lf_W = 460, lf_H = 230, lf_SAFE = 12;

/* a straight rule. the library's most common device. */
function lf_rule(x1, y1, x2, y2, c, w){
  return '<path d="M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2 + '"' +
         S(w || 1.5, c || HAIR) + '/>';
}

/* a graduated rule: reads as a measurement scale */
function lf_ruler(x1, y1, x2, y2, n, c){
  var b = lf_rule(x1, y1, x2, y2, c, 2);
  for (var i = 0; i <= n; i++){
    var t = i / n, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
    var long = (i % 5 === 0);
    b += lf_rule(x, y, x, y - (long ? 9 : 5), long ? INK : HAIR, long ? 2 : 1.2);
  }
  return b;
}

/* the single gold accent: a filled pip marking what the sentence is about */
function lf_gold(cx, cy, r){
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r || 5) +
         '" fill="' + GOLD + '"/>';
}

/* a knockout hub, for rotors and needle pivots */
function lf_hub(cx, cy, r){
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r || 7) +
         '" fill="' + BG + '"' + S(2.5, GOLD) + '/>';
}

/* a rotor: blades plus an OFF-CENTRE gold key, so a spin is actually visible */
function lf_rotor(cx, cy, r, dir, blades){
  var n = blades || 6;
  var b = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + S(1.5, HAIR) + '/>';
  b += '<g data-rot="fan" data-cx="' + cx + '" data-cy="' + cy +
       '" data-dir="' + (dir || 1) + '">';
  for (var i = 0; i < n; i++){
    var a = (i * 360 / n) * Math.PI / 180;
    b += '<path d="M' + (cx + Math.cos(a) * (r * 0.22)).toFixed(1) + ' ' +
         (cy + Math.sin(a) * (r * 0.22)).toFixed(1) + ' L' +
         (cx + Math.cos(a) * (r * 0.78)).toFixed(1) + ' ' +
         (cy + Math.sin(a) * (r * 0.78)).toFixed(1) + '"' + S(2.5) + '/>';
  }
  b += '<circle cx="' + (cx + r * 0.58) + '" cy="' + cy + '" r="2.4" fill="' + GOLD + '"/>';
  b += '</g>';
  return b;
}

/* a socketed module: the recurring "installed part" shape */
function lf_module(x, y, w, h, gold_edge, inner){
  var n = (inner === undefined) ? 3 : inner;
  var b = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
          '" rx="3"' + S(2, gold_edge ? GOLD : INK) + '/>';
  for (var i = 0; i < n; i++)
    b += lf_rule(x + w * 0.18, y + h * (0.22 + i * 0.24),
                 x + w * 0.82, y + h * (0.22 + i * 0.24), HAIR, 1.2);
  for (var f = 0; f < 4; f++)
    b += lf_rule(x + w * (0.22 + f * 0.19), y + h,
                 x + w * (0.22 + f * 0.19), y + h + 7, HAIR, 1.2);
  return b;
}

/* an arc: the scale a gauge needle reads against */
function lf_arc(cx, cy, r, from, to){
  var px = function(a, k){ return (cx + Math.cos(a * Math.PI / 180) * k).toFixed(1); };
  var py = function(a, k){ return (cy - Math.sin(a * Math.PI / 180) * k).toFixed(1); };
  return '<path d="M' + px(from, r) + ' ' + py(from, r) + ' A' + r + ' ' + r +
         ' 0 0 1 ' + px(to, r) + ' ' + py(to, r) + '"' + S(3) + '/>';
}

/* graduated ticks inside an arc */
function lf_arcTicks(cx, cy, r, from, to, n){
  var b = '';
  for (var i = 0; i <= n; i++){
    var a = from + (to - from) * (i / n), long = (i % 5 === 0);
    var px = function(k){ return (cx + Math.cos(a * Math.PI / 180) * k).toFixed(1); };
    var py = function(k){ return (cy - Math.sin(a * Math.PI / 180) * k).toFixed(1); };
    b += lf_rule(px(r - 14), py(r - 14), px(r - 2), py(r - 2),
                 long ? INK : HAIR, long ? 3 : 1.5);
  }
  return b;
}

/* a needle: gold, with data attrs so the motion block can settle it */
function lf_needle(cx, cy, rad, from, to){
  var px = (cx + Math.cos(from * Math.PI / 180) * rad).toFixed(1);
  var py = (cy - Math.sin(from * Math.PI / 180) * rad).toFixed(1);
  return '<path data-needle="1" data-from="' + from + '" data-to="' + to +
         '" data-cx="' + cx + '" data-cy="' + cy + '" data-rad="' + rad +
         '" d="M' + cx + ' ' + cy + ' L' + px + ' ' + py + '"' + S(3, GOLD) + '/>';
}

/* a row of bars on a shared baseline: the ladder device */
function lf_rungs(x, base, widths, heights, gap){
  var b = '', cx = x;
  for (var i = 0; i < widths.length; i++){
    var last = (i === widths.length - 1);
    b += '<rect x="' + cx + '" y="' + (base - heights[i]) + '" width="' + widths[i] +
         '" height="' + heights[i] + '" rx="3"' + S(2.5, last ? GOLD : INK) +
         (last ? ' fill="rgba(245,197,49,.07)"' : '') + '/>';
    for (var k = 1; k < 4; k++){
      var y = base - heights[i] * k / 4;
      b += lf_rule(cx + widths[i] * 0.16, y, cx + widths[i] * 0.84, y, HAIR, 1.2);
    }
    cx += widths[i] + (gap || 10);
  }
  return b;
}

  var widths = [300, 332, 356, 300];
  for (var i = 0; i < layers.length; i++){
    var y = layers[i][0], h = layers[i][1], w = widths[i], x = 80 + (356 - w) / 2;
    b += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="3"' +
         S(2, i === 1 ? GOLD : INK) + (i === 1 ? ' fill="rgba(245,197,49,.06)"' : '') + '/>';
    for (var k = 1; k <= 2; k++)
      b += lf_rule(x + 16, y + h * k / 3, x + w - 16, y + h * k / 3,
                   i === 1 ? GOLD : HAIR, 1.2);

    b += lf_rule(140 + q * 90, 142, 140 + q * 90, 122, HAIR, 1.5);

/* ---------------------------------------------------------------------------
   ram_stick_object -- a DIMM, seen flat. The two things that make it read as
   memory rather than a rectangle: the asymmetric contact edge along the bottom
   (with the notch) and the row of eight chips across the body.
   --------------------------------------------------------------------------- */
function art_ram_stick_object(){
  var b = "";
  var W = 380, X = 40, Y = 46, H = 132;
  // the board
  b += '<rect x="' + X + '" y="' + Y + '" width="' + W + '" height="' + H +
       '" rx="6"' + S(3, INK) + '/>';
  // 8 memory chips, two rows -- the signature of a DIMM
  for (var r = 0; r < 2; r++){
    for (var i = 0; i < 4; i++){
      var cx = X + 24 + i * 86, cy = Y + 20 + r * 52;
      var gold = (r === 0 && i === 1);
      b += '<rect x="' + cx + '" y="' + cy + '" width="62" height="40" rx="3" ' +
           'fill="' + (gold ? 'rgba(245,197,49,.16)' : 'rgba(246,246,244,.05)') + '"' +
           S(1.5, gold ? GOLD : HAIR) + '/>';
      // the pin row on each chip
      for (var p = 0; p < 4; p++){
        b += lf_rule(cx + 8 + p * 15, cy + 40, cx + 8 + p * 15, cy + 48, HAIR, 1.2);
      }
    }
  }
  // gold contact fingers along the bottom edge + the alignment notch
  var cy2 = Y + H;
  for (var k = 0; k < 22; k++){
    var fx = X + 14 + k * 16.4;
    if (fx > X + W * 0.42 && fx < X + W * 0.52) continue;   // the notch
    b += lf_rule(fx, cy2, fx, cy2 + 14, GOLD, 3);
  }
  b += '<path d="M' + (X + W * 0.42) + ' ' + (cy2 + 14) + ' L' + (X + W * 0.42) +
       ' ' + cy2 + ' L' + (X + W * 0.52) + ' ' + cy2 + ' L' + (X + W * 0.52) +
       ' ' + (cy2 + 14) + '" fill="none"' + S(2, INK) + '/>';
  // the gold data line sweeping across, one verb: sweep
  b += '<rect x="' + (X + 8) + '" y="' + (Y + H - 22) + '" width="12" height="10" rx="2" ' +
       'fill="' + GOLD + '" data-mv="sweep"/>';
  return svg('0 0 460 230', b, 'ram_stick_object');
}


/* ---------------------------------------------------------------------------
   laptop_object -- an OPEN laptop. Reads as a laptop because of the clamshell:
   screen tilted back, a hinge, and a keyboard deck with key rows in front.
   --------------------------------------------------------------------------- */
function art_laptop_object(){
  var b = "";
  var W = 268, X = 96;
  // lid / screen, tilted back
  b += '<path d="M' + X + ' 74 L' + (X + W) + ' 74 L' + (X + W - 10) + ' 26 L' +
       (X + 10) + ' 26 Z" fill="none"' + S(3, INK) + '/>';
  // bezel + a lit display with a gold block of content
  b += '<path d="M' + (X + 20) + ' 66 L' + (X + W - 20) + ' 66 L' + (X + W - 26) +
       ' 36 L' + (X + 26) + ' 36 Z" fill="rgba(56,217,232,.06)"' + S(1.5, HAIR) + '/>';
  b += lf_rule(X + 42, 50, X + 42 + 74, 50, INK, 3.5);
  b += lf_rule(X + 42, 58, X + 42 + 52, 58, HAIR, 2);
  b += '<rect x="' + (X + 138) + '" y="42" width="76" height="16" rx="2" fill="' +
       GOLD + '" opacity=".9" data-mv="sweep"/>';
  // the hinge
  b += lf_rule(X + 14, 74, X + W - 14, 74, INK, 4);
  // the keyboard deck: a trapezoid of key rows, which is what says "laptop"
  b += '<path d="M' + X + ' 78 L' + (X + W) + ' 78 L' + (X + W + 26) + ' 150 L' +
       (X - 26) + ' 150 Z" fill="rgba(246,246,244,.04)"' + S(3, INK) + '/>';
  for (var r = 0; r < 4; r++){
    var kx = X - 18 + r * 5, ky = 89 + r * 15, kw = W + 36 - r * 10;
    for (var k = 0; k < 12; k++){
      var w2 = (r === 3 && k > 3 && k < 8) ? 24 : 13;
      b += '<rect x="' + (kx + 7 + k * (kw - 14) / 12) + '" y="' + ky +
           '" width="' + w2 + '" height="9" rx="1.5" fill="none"' + S(1.2, HAIR) + '/>';
    }
  }
  // trackpad
  b += '<rect x="' + (X + 100) + '" y="' + (135) + '" width="68" height="11" rx="2" ' +
       'fill="none"' + S(1.5, HAIR) + '/>';
  return svg('0 0 460 230', b, 'laptop_object');
}

function art_gpu_card_object(){
  var b = "";
  var X = 26, Y = 46, W = 408, H = 108;      // long and thin: the card read
  // the PCB
  b += '<rect x="' + X + '" y="' + Y + '" width="' + W + '" height="' + H +
       '" rx="5" fill="rgba(246,246,244,.03)"' + S(3, INK) + '/>';
  // the shroud across the top half, with two fans ON THE CARD
  b += '<rect x="' + (X + 8) + '" y="' + (Y + 8) + '" width="' + (W - 92) +
       '" height="' + (H - 30) + '" rx="4" fill="none"' + S(2.5, HAIR) + '/>';
  b += lf_rotor(X + 74, Y + 47, 24, 1, 7);
  b += lf_rotor(X + 178, Y + 47, 24, -1, 7);
  // the gold accent: the SLOT the card sits in, drawn as a short bar
  b += '<rect x="' + (X + 232) + '" y="' + (Y + 18) + '" width="70" height="26" rx="3" fill="' +
       GOLD + '" opacity=".92" data-mv="sweep"/>';
  // the power connectors at the far end
  for (var p = 0; p < 2; p++){
    b += '<rect x="' + (X + 322 + p * 34) + '" y="' + (Y + 14) + '" width="26" ' +
         'height="18" rx="2" fill="none"' + S(1.5, HAIR) + '/>';
  }
  // the BACKPLATE / heatsink fins visible along the card body
  for (var f = 0; f < 14; f++){
    b += lf_rule(X + 16 + f * 10, Y + H - 22, X + 16 + f * 10, Y + H - 8, HAIR, 1.2);
  }
  // ---- the identity features -------------------------------------------------
  // the PCIe gold-finger edge: a segmented strip below the PCB
  var gy = Y + H + 4;
  for (var k = 0; k < 26; k++){
    if (k > 20 && k < 23) continue;                    // the key notch
    b += lf_rule(X + 20 + k * 14, gy, X + 20 + k * 14, gy + 12, GOLD, 3);
  }
  // the display bracket at the left end, with output ports
  b += '<path d="M' + (X - 14) + ' ' + (Y - 12) + ' L' + X + ' ' + (Y - 12) +
       ' L' + X + ' ' + (Y + H + 16) + ' L' + (X - 14) + ' ' + (Y + H + 16) +
       ' Z" fill="none"' + S(2.5, INK) + '/>';
  for (var o = 0; o < 3; o++){
    b += '<rect x="' + (X - 11) + '" y="' + (Y + 4 + o * 30) + '" width="8" height="18" rx="1.5" ' +
         'fill="none"' + S(1.5, HAIR) + '/>';
  }
  return svg('0 0 460 230', b, 'gpu_card_object');
}

/* ============================================================================
   4b. ART MOTION — every figure is a pure function of its own age
   ----------------------------------------------------------------------------
   Called from renderState() once per frame. Each movement below is computed
   from u, the seconds since the FIGURE landed (not since the scene cut), so a
   settle animation is actually visible instead of spending itself behind the
   entrance. Nothing accumulates and nothing is remembered between frames, so
   t -> frame is a function with no history.
   ========================================================================== */

function artRefs(root){
  if (root._refs) return root._refs;
  const q = s => root.querySelectorAll(s);
  root._refs = {
    fans:  q("[data-rot]"),
    pcie:  q("[data-pcie]"),
    mem:   q("[data-memled]"),
    beam:  root.querySelector("[data-beam]"),
    panL:  root.querySelector('[data-pan="l"]'),
    panR:  root.querySelector('[data-pan="r"]'),
    pulse: root.querySelector("[data-pulse]")
  };
  return root._refs;
}

function animateArt(idx, t){
  const root = document.getElementById("s" + idx + "_art");
  if (!root) return;
  const R = artRefs(root);

  if (root._t0 == null){
    const sc = F.scenes[idx];
    const b = (sc.beats || []).filter(x => x.id === "s" + idx + "_art")[0];
    root._t0 = b ? b.s : sc.s;
  }
  const u = Math.max(0, t - root._t0);

  // --- fans: 80 deg/s, counter-rotating, so the pair reads as two bearings
  for (let i = 0; i < R.fans.length; i++){
    const g = R.fans[i];
    const dir = +g.getAttribute("data-dir") || 1;
    g.setAttribute("transform", "rotate(" + (dir * u * 80 % 360).toFixed(2) +
      " " + g.getAttribute("data-cx") + " " + g.getAttribute("data-cy") + ")");
  }

  // --- PCIe contacts: one highlight chases the row, 1.6 s a lap
  if (R.pcie.length){
    const n = R.pcie.length, q = (u % 1.6) / 1.6;
    for (let i = 0; i < n; i++){
      const d = Math.abs(i / (n - 1) - q);
      const w = Math.max(0, 1 - d * 3.0);
      R.pcie[i].setAttribute("opacity", (0.30 + 0.70 * w * w).toFixed(3));
    }
  }

  // --- memory modules: a gold activity wave sweeps out and back, 3.2 s
  if (R.mem.length){
    const n = R.mem.length, q = (u % 3.2) / 3.2;
    const head = (q < 0.5 ? q * 2 : (1 - q) * 2) * (n - 1);
    for (let i = 0; i < n; i++){
      const w = Math.max(0, 1 - Math.abs(i - head) / 1.8);
      R.mem[i].setAttribute("opacity", (0.10 + 0.90 * w * w).toFixed(3));
    }
  }

  /* --- beam: a damped settle, not a loop. It overshoots, corrects, overshoots
     less, and comes to rest -- the physical read of a balance being loaded. */
  if (R.beam){
    const dir = idx % 2 ? -1 : 1;
    const theta = 1.7 * dir * (1 - Math.exp(-3 * u) * Math.cos(4.2 * u));
    R.beam.setAttribute("transform", "rotate(" + theta.toFixed(3) + " 250 66)");
    const dy = Math.sin(theta * Math.PI / 180) * 130;
    R.panL.setAttribute("transform", "translate(0 " + (-dy).toFixed(2) + ")");
    R.panR.setAttribute("transform", "translate(0 " + ( dy).toFixed(2) + ")");
  }

  // --- fabric: a pulse runs the gold bus, 2 s a lap, fading at both ends
  if (R.pulse){
    const q = (u % 2.0) / 2.0;
    R.pulse.setAttribute("transform", "translate(" +
      (104 + (270 - 104) * q).toFixed(1) + " 0)");
    R.pulse.setAttribute("opacity", (Math.sin(Math.PI * q) * 0.95).toFixed(3));
  }
}

/* ============================================================================
   5. DOM EMIT — one renderer per layout, mirroring r_hook / r_bars / ...
   ========================================================================== */

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// A display word ends a sentence if it carries terminal punctuation, allowing
// for a closing quote or bracket after it. Used to stop the caption window
// reaching back into the previous sentence.
const SENT_END = /[.?!]["'\u201d\u2019)\]]*$/;
const isSentEnd = s => SENT_END.test(s || "");

/* Title -> one wrapper per word so it can land word-by-word as it is spoken.
   <em> runs are split per word too, so the gold span never straddles tags. */
function wrapTitle(html){
  const out = [];
  String(html).split(/(<em>[\s\S]*?<\/em>)/g).forEach(part => {
    if (!part) return;
    if (part.slice(0, 4) === "<em>"){
      part.slice(4, -5).split(/\s+/).filter(Boolean)
        .forEach(w => out.push('<em class="tw">' + w + '</em>'));
    } else {
      part.split(/\s+/).filter(Boolean)
        .forEach(w => out.push('<span class="tw">' + w + '</span>'));
    }
  });
  return out.join(" ");
}

function header(sc){
  return '<div class="kicker" id="s' + sc.i + '_k"><i></i>' + esc(sc.kicker) + '</div>' +
         '<div class="display" id="s' + sc.i + '_hdr">' + wrapTitle(sc.title) + '</div>';
}
function artPanel(sc){
  if (!sc.art) return "";
  const m = ARTMETA[sc.art] || { kind: "", note: "" };
  return '<div class="artpanel" id="s' + sc.i + '_art">' +
           '<div class="figbar"><b>' + esc(m.kind) + '</b><span>' + esc(m.note) + '</span></div>' +
           '<div class="figbox">' + ART[sc.art]() + '</div>' +
           '<div class="artcap">' + esc(sc.art_caption || "") + '</div></div>';
}
function src(sc){
  return sc.source ? '<div class="src" id="s' + sc.i + '_src">' + esc(sc.source) + '</div>' : "";
}
function closing(sc){
  if (!sc.closing) return "";
  const c = sc.closing.c === "gold" ? "" : " chip--" + sc.closing.c;
  return '<div class="closing"><span class="chip' + c + '" id="s' + sc.i + '_close">' +
         esc(sc.closing.t) + '</span></div>';
}

const RENDER = {
  hook(sc){
    let stats = "";
    (sc.stats || []).forEach((c, j) => {
      stats += '<div class="stat ' + (c.c ? "stat--" + c.c : "") + '" id="s' + sc.i + '_stat' + j + '">' +
        '<span class="stat__v" data-count="' + esc(c.v) + '">0</span>' +
        '<span class="stat__u">' + esc(c.u) + '</span>' +
        '<span class="stat__l">' + esc(c.lab) + '</span></div>';
    });
    /* The chips become a ledger: two candidates ruled out, then the answer kept.
       Same beats, same ids — only the composition changes. */
    const entries = [];
    (sc.chips || []).forEach((c, j) => entries.push({
      id: "s" + sc.i + "_chip" + j, c: c.c, t: c.t, strike: true
    }));
    if (sc.closing) entries.push({
      id: "s" + sc.i + "_close", c: "gold", t: sc.closing.t, strike: false
    });
    const rows = entries.map((e, j) =>
      '<div class="ledger__row' + (e.c && e.c !== "gold" ? " ledger__row--" + e.c : "") +
        (e.c === "gold" ? " ledger__row--gold" : "") + '" id="' + e.id + '">' +
        '<span class="ledger__rank">' + String(j + 1).padStart(2, "0") + '</span>' +
        '<span class="ledger__name">' + esc(e.t) +
          (e.strike ? '<i class="strike"></i>' : "") + '</span></div>').join("");
    return header(sc) +
      '<div class="inner"><div class="body"><div class="col">' +
        (stats ? '<div class="stats">' + stats + '</div>' : "") +
        (rows ? '<div class="ledger"><div class="ledger__bar" id="s' + sc.i +
                '_ledgerbar"><b>DECISION LEDGER</b>' +
                '<span>WHAT DECIDES A LOAD</span></div>' +
                '<div class="ledger__rows">' + rows + '</div></div>' : "") +
      '</div><div class="col col--art">' + artPanel(sc) + '</div></div>' +
      /* the ledger's last row is this scene's closing chip — no duplicate */
      (rows ? "" : closing(sc)) + '</div>';
  },
  bars(sc){
    let bars = "";
    (sc.bars || []).forEach((c, j) => {
      bars += '<div class="bar ' + (c.cls ? "bar--" + c.cls : "") + '" id="s' + sc.i + '_bar' + j + '">' +
        '<div class="bar__lab">' + esc(c.lab) + '</div>' +
        '<div class="bar__track"><div class="bar__fill" data-fill="' + c.pct + '"></div></div>' +
        '<div class="bar__val"><span data-count="' + esc(c.val) + '">0</span>' +
        '<small>' + esc(c.unit) + '</small></div></div>';
    });
    return header(sc) +
      '<div class="inner"><div class="body"><div class="col"><div class="bars">' + bars + '</div>' +
      closing(sc) + '</div><div class="col col--art">' + artPanel(sc) + '</div></div></div>';
  },
  rows(sc){
    let rows = "";
    (sc.rows || []).forEach((c, j) => {
      rows += '<div class="row ' + (c.cls ? "row--" + c.cls : "") + '" id="s' + sc.i + '_row' + j + '">' +
        '<span class="row__rank">' + esc(c.rank) + '</span>' +
        '<span class="row__name">' + esc(c.name) + '<span class="row__sub">' + esc(c.sub) + '</span></span>' +
        '<span class="row__val' + (/\d/.test(c.val) ? "" : " row__val--sm") + '">' + esc(c.val) + '</span></div>';
    });
    return header(sc) +
      '<div class="inner"><div class="body"><div class="col"><div class="rows">' + rows + '</div>' +
      closing(sc) + '</div><div class="col col--art">' + artPanel(sc) + '</div></div></div>';
  },
  note(sc){
    let items = "";
    (sc.note_items || []).forEach((c, j) => {
      items += '<li id="s' + sc.i + '_li' + j + '">' + esc(c.t) + '</li>';
    });
    return header(sc) +
      '<div class="inner"><div class="body"><div class="col">' +
      '<div class="note"><h4>' + esc(sc.note_head) + '</h4><ul>' + items + '</ul></div>' +
      '</div><div class="col col--art">' + artPanel(sc) + '</div></div></div>';
  },
  chain(sc){
    let nodes = "";
    (sc.chain || []).forEach((c, j) => {
      if (j) nodes += '<div class="chain__arrow">→</div>';
      nodes += '<div class="chain__node ' + (j === sc.chain.length - 1 ? "chain__node--gold" : "") +
        '" id="s' + sc.i + '_node' + j + '"><b>' + esc(c.t) + '</b><span>' + esc(c.s) + '</span></div>';
    });
    return header(sc) +
      '<div class="inner"><div class="body"><div class="col"><div class="chain">' + nodes + '</div>' +
      closing(sc) + '</div><div class="col col--art">' + artPanel(sc) + '</div></div></div>';
  },
};

/* ============================================================================
   6. RUNTIME — renderState(t) is the only painter
   ========================================================================== */

const stage = document.getElementById("stage");
const barEl = document.getElementById("bar");
const tcEl  = document.getElementById("tc");
const dipEl = document.getElementById("dip");
const subsEl = document.getElementById("sub-active");
const gridEl = document.getElementById("grid");
const sweepEl = document.getElementById("sweep");
const glowEl = document.getElementById("glow");
const wipeEl = document.getElementById("wipe");
  const chapEl = null;  /* chapter display removed: no chapter reference may appear */
const ticksEl = document.getElementById("ticks");
let tkfEl = null, tkhEl = null;

const EASE = {
  rise:  p => 1 - Math.pow(1 - p, 3),
  slam:  p => 1 + 2.2 * Math.pow(p - 1, 3) + 1.2 * Math.pow(p - 1, 2),
  pop:   p => 1 + 1.70158 * Math.pow(p - 1, 3) + 1.70158 * Math.pow(p - 1, 2),
  draw:  p => 1 - Math.pow(1 - p, 3),
  fill:  p => 1 - Math.pow(1 - p, 3),
};
const clamp = p => p < 0 ? 0 : p > 1 ? 1 : p;
const fmt = n => Number(n).toLocaleString("en-US");

let LASTIDX = -1;

/* Scene boundaries as tall notches, plus one small tick per spoken beat, so the
   rail is a real timeline of the narration. Pure layout, no timing change. */
function buildRail(){
  let html = '<span class="tkf"></span>';
  F.beats.forEach(b => {
    html += '<span class="bt" style="left:' + ((b.s / F.total) * 100).toFixed(3) + '%"></span>';
  });
  F.scenes.forEach((sc, i) => {
    if (i) html += '<span class="tk" style="left:' + ((sc.s / F.total) * 100).toFixed(3) + '%"></span>';
  });
  html += '<span class="tkh"></span>';
  ticksEl.innerHTML = html;
  tkfEl = ticksEl.querySelector(".tkf");
  tkhEl = ticksEl.querySelector(".tkh");
}

/* Kinetic type: each word lands in sequence inside the beat it already owns. */
function staggerTitle(el, prog){
  const ws = el.querySelectorAll(".tw");
  const n = ws.length || 1;
  const step = 0.55 / n;
  for (let k = 0; k < ws.length; k++){
    const p = clamp((prog - k * step) * 1.9);
    ws[k].style.opacity = p.toFixed(3);
    ws[k].style.transform = p >= 1 ? "none" : "translateY(" + ((1 - p) * 26).toFixed(1) + "px)";
  }
}

function renderState(t){
  // --- scene visibility
  let idx = -1;
  for (let i = 0; i < F.scenes.length; i++) if (t >= F.scenes[i].s) idx = i;
  if (idx < 0) idx = 0;

  if (idx !== LASTIDX){
    document.querySelectorAll(".scene").forEach((el, i) => el.classList.toggle("on", i === idx));
    LASTIDX = idx;
  }

  // --- transitions: the outgoing frame dims, then a gold wipe leads the cut in.
  // Both are pure functions of t, so a still at any t is reproducible.
  let dip = 0, wipe = -1;
  F.scenes.forEach(sc => {
    if (t > sc.e - 0.20 && t <= sc.e)      dip = Math.max(dip, ((t - (sc.e - 0.20)) / 0.20) * 0.30);
    if (t >= sc.s && t < sc.s + 0.12)      dip = Math.max(dip, (1 - (t - sc.s) / 0.12) * 0.12);
    if (t >= sc.s && t < sc.s + 0.34)      wipe = Math.max(wipe, (t - sc.s) / 0.34);
  });
  dipEl.style.opacity = dip.toFixed(3);
  wipeEl.style.opacity = wipe < 0 ? 0 : (1 - wipe).toFixed(3);
  wipeEl.style.transform = "translateX(" + ((wipe < 0 ? 1 : wipe) * 1920 - 3).toFixed(1) + "px)";

  // --- beats
  F.beats.forEach(b => {
    const el = document.getElementById(b.id);
    if (!el) return;
    const p = clamp((t - b.s) / Math.max(0.001, b.e - b.s));
    const v = EASE[b.kind] || EASE.rise;

    if (t < b.s){                       // not yet arrived
      el.style.opacity = 0;
      el.style.transform = b.kind === "rise" ? "translateY(14px)" :
                           b.kind === "slam" ? "translateY(-30px) scale(1.10)" :
                           b.kind === "pop"  ? "scale(.86)" : "none";
      if (b.count) { const c = el.querySelector("[data-count]");
        if (c) { c.textContent = "0"; c.style.clipPath = "inset(0 100% 0 0)"; } }
      if (b.fill){ const f = el.querySelector("[data-fill]"); if (f) f.style.width = "0%"; }
      if (b.id.slice(-4) === "_hdr") staggerTitle(el, 0);
      const sk0 = el.querySelector(".strike");
      if (sk0) sk0.style.transform = "scaleX(0)";
      return;
    }

    el.style.opacity = 1;
    if (b.kind === "rise") el.style.transform = p >= 1 ? "none" : "translateY(" + (14 * (1 - v(p))).toFixed(2) + "px)";
    else if (b.kind === "slam") el.style.transform = "translateY(" + (-30 * (1 - v(p))).toFixed(2) + "px) scale(" + (1.10 - .10 * v(p)).toFixed(3) + ")";
    else if (b.kind === "pop")  el.style.transform = "scale(" + (0.86 + .14 * v(p)).toFixed(3) + ")";
    else el.style.transform = "none";

    if (b.id.slice(-4) === "_hdr") staggerTitle(el, p);

    // a struck-out entry: the rule is drawn across as the word is spoken
    const sk = el.querySelector(".strike");
    if (sk) sk.style.transform = "scaleX(" + v(p).toFixed(3) + ")";

    if (b.count){
      const out = el.querySelector("[data-count]");
      if (out){
        const raw = b.count.v != null ? b.count.v : b.count.val;   // stats use v, bars use val
        const target = parseFloat(String(raw).replace(/[^\d.]/g, "")) || 0;
        out.textContent = fmt(Math.round(target * v(p)));
        // the numeral is uncovered by a wipe, not faded in: reads as measured
        out.style.clipPath = "inset(0 " + ((1 - v(p)) * 100).toFixed(1) + "% 0 0)";
      }
    }
    if (b.fill){
      const f = el.querySelector("[data-fill]");
      if (f) f.style.width = (b.fill.pct * v(p)).toFixed(2) + "%";
    }
  });

  // --- figure motion: transform attributes only, derived from t alone
  animateArt(idx, t);

  /* A panel caption must not float above an empty panel: the ledger bar belongs
     to its first entry, so it fades in with row 01 rather than under the title. */
  const lbEl = document.getElementById("s" + idx + "_ledgerbar");
  if (lbEl){
    const first = F.scenes[idx].beats.filter(b => /_chip0$/.test(b.id))[0];
    lbEl.style.opacity = first ? clamp((t - first.s) / 0.45).toFixed(3) : 0;
  }

  // --- captions: 8-word group, active word highlighted. The window is clamped
  // to the current scene, so a caption never shows words from the next one.
  // It is also clamped FORWARD to the start of the sentence being spoken: a
  // window that reaches back into the previous sentence puts a fresh capital
  // mid-line behind orphan words, e.g. "second The memory capacity ...".
  const words = F.words;
  const scNow = F.scenes[idx];
  const disp = (scNow.d && scNow.d.length === scNow.w1 - scNow.w0) ? scNow.d : null;
  let wi = -1;
  for (let i = 0; i < words.length; i++) if (words[i][0] <= t) wi = i; else break;
  wi = Math.min(Math.max(wi, scNow.w0), scNow.w1 - 1);

  // index of the first word of the sentence currently being spoken
  let sentStart = scNow.w0;
  if (disp) {
    for (let i = wi; i > scNow.w0; i--) {
      if (SENT_END.test(disp[i - 1 - scNow.w0])) { sentStart = i; break; }
    }
  }

  let start = Math.max(scNow.w0, sentStart, wi - 3);
  const end = Math.min(scNow.w1, start + 8);
  start = Math.max(scNow.w0, sentStart, end - 8);
  const group = words.slice(start, end);
  subsEl.innerHTML = group.map(([wt, w], k) =>
    '<span class="sub-word' + (start + k === wi ? ' sub-word--on' : '') + '">' +
    esc(disp ? disp[start + k - scNow.w0] : w) + '</span>'
  ).join(" ");

  // --- ambient layers: pure functions of t. No wall clock, so stills repeat.
  gridEl.style.transform = "translate3d(" + (-((t * 5) % 96)).toFixed(1) + "px," +
                                            (-((t * 3) % 96)).toFixed(1) + "px,0)";
  sweepEl.style.transform = "translate3d(0," + (((t * 74) % 1460) - 360).toFixed(1) + "px,0)";
  glowEl.style.transform = "translate(" + (1360 + Math.sin(t * 0.19) * 74).toFixed(1) + "px," +
                                           (470 + Math.cos(t * 0.14) * 66).toFixed(1) + "px) translate(-50%,-50%)";
  glowEl.style.opacity = (0.62 + 0.38 * (0.5 + 0.5 * Math.sin(t * 0.42))).toFixed(3);

  // --- chrome + rail
  const prog = t / F.total;
  const pct = (prog * 100).toFixed(3);
  barEl.style.width = pct + "%";
  if (tkfEl){ tkfEl.style.width = pct + "%"; tkhEl.style.left = pct + "%"; }
  const mm = Math.floor(t / 60), ss = Math.floor(t % 60);
  const tm = Math.floor(F.total / 60), ts = Math.floor(F.total % 60);
  tcEl.textContent = String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0") +
                     " / " + String(tm).padStart(2, "0") + ":" + String(ts).padStart(2, "0");
  /* chapter counter removed: no chapter reference may appear */
}

/* ============================================================================
   7. TRANSPORT — the voice is the clock
   ----------------------------------------------------------------------------
   Production drives renderState() from audio.currentTime. So does this. There is
   no virtual clock in the playback path: if the audio stalls, the picture stalls
   with it, which is the whole point of an audio-locked build.

   Browsers refuse to start audio without a user gesture, so the piece opens on a
   poster and begins on one click. That is a browser rule, not a design choice.
   ========================================================================== */

const vo = new Audio();
vo.preload = "auto";
vo.src = "data:audio/mpeg;base64," + AUDIO_B64;

let playing = false, raf = 0, watchdog = 0, lastTick = 0, audioOk = false;

const nowSec = () => vo.currentTime;

function tick(){
  if (!playing) return;
  lastTick = performance.now();
  const t = Math.min(nowSec(), F.total);
  renderState(t);
  if (t >= F.total - 0.02) stop();
}
function rafLoop(){
  if (!playing) return;
  tick();
  raf = requestAnimationFrame(rafLoop);
}
function stopTicker(){ cancelAnimationFrame(raf); clearInterval(watchdog); watchdog = 0; }
function startTicker(){
  stopTicker();
  lastTick = performance.now();
  raf = requestAnimationFrame(rafLoop);
  // rAF never fires in a background tab or an uncomposited window; the interval
  // keeps the picture following the audio regardless of compositing.
  watchdog = setInterval(() => {
    if (!playing) return;
    if (performance.now() - lastTick > 200) tick();
  }, 100);
}

function play(){
  if (playing) return;
  if (vo.currentTime >= F.total - 0.05) vo.currentTime = 0;
  playing = true;
  const p = vo.play();
  if (p && p.catch) p.catch(err => {
    playing = false; setBtn();
    console.warn("[AUDIO] blocked:", err.message);
  });
  startTicker();
  setBtn();
}
function stop(){
  playing = false;
  vo.pause();
  stopTicker();
  setBtn();
}
function pause(){
  if (!playing) return;
  playing = false;
  vo.pause();
  stopTicker();
  setBtn();
}
function seek(t){
  vo.currentTime = Math.max(0, Math.min(F.total, t));
  renderState(vo.currentTime);
  if (playing) startTicker();
  setBtn();
}
const btn = document.getElementById("play");
const btnStop = document.getElementById("stop");
const btnSpeed = document.getElementById("speed");

/* Transport state that is not the audio element's own. Speed lives on `vo`,
   so the picture follows for free: renderState() is driven from
   vo.currentTime, and currentTime advances at 2x just as the sound does. */
let SPEED = 1;
const SPEEDS = [1, 2, 4];

/* Voice level. Volume is not part of the clock: turning it to zero must still
   run the picture, because the picture is driven by vo.currentTime, not by
   whether anything is audible. Muting therefore never desyncs the piece. */
const volEl = document.getElementById("vol");
const volVal = document.getElementById("volval");
const muteBtn = document.getElementById("mute");
let VOLUME = 1, LASTVOL = 1;

function setVolume(v){
  VOLUME = Math.max(0, Math.min(1, v));
  if (VOLUME > 0) LASTVOL = VOLUME;      // so unmute restores what you had, not 100%
  vo.volume = VOLUME;
  volEl.value = String(Math.round(VOLUME * 100));
  // appearance:none kills the native fill, so draw it: the level must be
  // readable at a glance, not only from the number beside it
  const pct = Math.round(VOLUME * 100) + "%";
  volEl.style.background = "linear-gradient(90deg,var(--gold) 0 " + pct +
                           ",var(--hair) " + pct + " 100%)";
  volEl.setAttribute("aria-valuetext", Math.round(VOLUME * 100) + "%");
  volVal.textContent = Math.round(VOLUME * 100) + "%";
  muteBtn.classList.toggle("on", VOLUME === 0);
  muteBtn.setAttribute("aria-pressed", VOLUME === 0 ? "true" : "false");
}
function toggleMute(){ setVolume(VOLUME === 0 ? LASTVOL : 0); }
volEl.addEventListener("input", () => setVolume(volEl.value / 100));
muteBtn.addEventListener("click", toggleMute);
setVolume(1);

function restart(){
  stop();                    // halts audio and ticker, flips `playing`
  vo.currentTime = 0;
  renderState(0);
  setBtn();
}
function setSpeed(rate){
  SPEED = SPEEDS.indexOf(rate) >= 0 ? rate : 1;
  vo.playbackRate = SPEED;
  setBtn();
}
function toggleSpeed(){
  setSpeed(SPEEDS[(SPEEDS.indexOf(SPEED) + 1) % SPEEDS.length]);
}

function setBtn(){
  btn.textContent = playing ? "PAUSE" : (vo.currentTime >= F.total - 0.05 ? "REPLAY" : "PLAY");
  btnSpeed.textContent = SPEED + "×";
  btnSpeed.classList.toggle("on", SPEED !== 1);
}

/* A tab switch must not desync picture from voice: pause both. */
document.addEventListener("visibilitychange", () => {
  if (document.hidden && playing) pause();
});

/* Deterministic still: same painter, no audio. */
window.renderAt = function(t){
  playing = false; stopTicker();
  document.body.classList.add("render");
  document.getElementById("ctl").style.display = "none";
  renderState(t);
};

/* ============================================================================
   8. BOOT
   ========================================================================== */

function fatal(err){
  const b = document.getElementById("boot");
  if (!b) return;
  b.classList.remove("hide");
  document.getElementById("booterr").textContent =
    "This browser did not start the sample.\n\n" +
    (err && err.stack ? err.stack : String(err)) +
    "\n\nOpen it in Chrome, Edge or Firefox.";
}
addEventListener("error", e => fatal(e.error || e.message));

try {
  build();
  window.F = F;   // expose for review / inspection in devtools
  window.VO = vo;
  /* Self-check from the console: is the picture on the word being spoken? */
  window.audit = function(){
    const t = vo.currentTime;
    let wi = -1;
    for (let i = 0; i < F.words.length; i++) if (F.words[i][0] <= t) wi = i; else break;
    let sc = 0;
    F.scenes.forEach((s, i) => { if (t >= s.s) sc = i; });
    const word = wi >= 0 ? F.words[wi][1] : "(none)";
    const shown = F.beats.filter(b => b.s <= t && b.e > t - 6)
      .map(b => b.id + " @" + b.s.toFixed(2) + " ⟵ " + b.at);
    return { t: +t.toFixed(2), paused: vo.paused, scene: sc, wordIndex: wi,
             word: word, recentlyArrived: shown };
  };
  const PROBLEMS = check();
  buildRail();

  // emit scenes
  stage.insertAdjacentHTML("beforeend", F.scenes.map(sc =>
    '<section class="scene" data-scene="' + sc.i + '">' +
      RENDER[sc.layout](sc) + src(sc) +
    '</section>'
  ).join(""));

  renderState(0);

  // fit the 1920x1080 stage to the window without changing coordinates
  function fit(){
    const k = Math.min(innerWidth / 1920, innerHeight / 1080) * 0.96;
    stage.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }
  addEventListener("resize", fit); fit();

  // keyboard: Space play/pause, arrows scrub, S stop, X speed, M mute
  addEventListener("keydown", e => {
    if (e.code === "Space"){ e.preventDefault(); playing ? pause() : play(); }
    if (e.code === "ArrowRight") seek(Math.min(F.total, vo.currentTime + 5));
    if (e.code === "ArrowLeft")  seek(Math.max(0,       vo.currentTime - 5));
    if (e.key === "s" || e.key === "S") restart();
    if (e.key === "x" || e.key === "X") toggleSpeed();
    if (e.key === "m" || e.key === "M") toggleMute();
  });
  btn.addEventListener("click", () => playing ? pause() : play());
  btnStop.addEventListener("click", restart);
  btnSpeed.addEventListener("click", toggleSpeed);
  setBtn();

  // ?t=SECONDS -> deterministic still, same path as playback
  const q = new URLSearchParams(location.search);
  if (q.has("t")){
    const go = () => window.renderAt(parseFloat(q.get("t")) || 0);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go);
    else go();
  } else {
    // Nothing starts on its own. The piece opens on a poster whose only control
    // is PLAY. A stray click anywhere used to start the timeline, which meant
    // the reviewer could set the piece running while reaching for the mouse --
    // so a click that is not on PLAY now does deliberately nothing.
    document.getElementById("boot").classList.remove("hide");
    document.querySelector("#boot .boot__sub").textContent = "the memory bandwidth myth \u00b7 sound on \u00b7 press play when ready";
    document.getElementById("bootplay").addEventListener("click", () => {
      document.getElementById("boot").classList.add("hide");
      play();
    });
  }

  // The poster must never hide a real failure.
  if (q.has("t")) document.getElementById("boot").classList.add("hide");

  /* Sync audit: how far each on-screen element lands from the word that
     introduces it. Production tolerance is the rhythm law, not perfection. */
  let worst = 0, late = 0;
  F.beats.forEach(b => {
    const d = b.s - b.raw;                  // scheduled minus spoken
    if (d > worst) worst = d;
    if (d > 0.001) late++;
  });

  console.log("[SAMPLE] scenes=" + F.scenes.length +
              " beats=" + F.beats.length +
              " words=" + F.words.length +
              " total=" + F.total.toFixed(2) + "s" +
              " bindingProblems=" + PROBLEMS.length);
  console.log("[SYNC] audio=" + (isFinite(vo.duration) ? vo.duration.toFixed(2) + "s" : "(still loading)") +
              " timing=" + F.total.toFixed(2) + "s" +
              " beatsPushed=" + late +
              " worstPush=" + worst.toFixed(2) + "s");
} catch (err) {
  fatal(err);
  console.error(err);
}
</script>
