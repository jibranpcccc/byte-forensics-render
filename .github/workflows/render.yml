name: render-1440p

# Two sharded stages, because the profile says the ENCODE is the bottleneck:
#
#   measured on run 41192802534 (EP16, 1440p, 8 shards)
#     render shards   174-281 s   (parallel -> wall ~280 s)
#     assemble        801 s       of which ENCODE = 725 s
#     whole run      1189 s       => the encode was 61% of the entire run
#
# So encoding is split the same way rendering already is: N jobs each encode
# their own fraction into a LOSSLESS part, then a small job concatenates the
# parts (stream copy, no re-encode) and muxes the audio once.
#
# Wall time becomes (slowest render shard) + (slowest encode shard) + (fast concat)
# instead of (slowest render shard) + (one serial 12-minute encode).

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "episode HTML path"
        required: true
        default: "EPISODES/EP16-FULL.html"
      preset:
        description: "1080p | 1440p | 4k"
        required: true
        default: "1440p"
      shards:
        description: "parallel shards for BOTH render and encode"
        required: true
        default: "12"
      quality:
        description: "encode preset: veryfast (fast) or medium (slowest, tiny gain)"
        required: true
        default: "veryfast"

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      frames: ${{ steps.t.outputs.frames }}
    steps:
      - uses: actions/checkout@v4

      - id: t
        name: read the episode runtime from the embedded TIMING
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          src = open("${{ github.event.inputs.episode }}", encoding="utf-8").read()
          m = re.search(r"const TIMING = /\*__TIMING__\*/(\{.*?\});", src, re.S)
          if not m:
              raise SystemExit("no embedded TIMING -- is the audio attached?")
          print("frames=%d" % int(round(json.loads(m.group(1))["total"] * 30)))
          PY

      - id: m
        name: generate the shard matrix from the input
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          n = int("${{ github.event.inputs.shards }}")
          if n < 1 or n > 40:
              raise SystemExit("shards must be 1..40")
          print("matrix=" + json.dumps({"shard": list(range(n))}))
          PY

  render:
    needs: probe
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.probe.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-v1
          restore-keys: pw-${{ runner.os }}-

      - name: install playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: render shard ${{ matrix.shard }} of ${{ github.event.inputs.shards }}
        run: |
          python render_episode.py "${{ github.event.inputs.episode }}" \
            --preset "${{ github.event.inputs.preset }}" \
            --shard "${{ matrix.shard }}/${{ github.event.inputs.shards }}" \
            --quality 92

      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.shard }}
          path: _frames_*/
          retention-days: 2

  flatten:
    needs: [probe, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          merge-multiple: true
          path: _frames_all

      - name: verify every frame arrived, then flatten
        run: |
          want=${{ needs.probe.outputs.frames }}
          have=$(find _frames_all -name 'f*.jpg' -type f | wc -l)
          echo "frames present: $have, expected: $want"
          if [ "$have" -ne "$want" ]; then
            echo "::error::$((want - have)) frames missing -- a shard failed"
            exit 1
          fi
          mkdir -p _frames_flat
          find _frames_all -name 'f*.jpg' -type f -exec cp {} _frames_flat/ \;
          echo "flattened $(find _frames_flat -name 'f*.jpg' | wc -l) frames"

      - uses: actions/upload-artifact@v4
        with:
          name: frames-flat
          path: _frames_flat/
          retention-days: 2
          compression-level: 0

  encode:
    needs: [probe, flatten]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.probe.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: actions/download-artifact@v4
        with:
          name: frames-flat
          path: _frames_flat

      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: encode part ${{ matrix.shard }} of ${{ github.event.inputs.shards }}
        run: |
          python encode_episode.py "${{ github.event.inputs.episode }}" \
            --frames _frames_flat \
            --shards "${{ github.event.inputs.shards }}" \
            --part "${{ matrix.shard }}" \
            --preset "${{ github.event.inputs.quality }}"

      - uses: actions/upload-artifact@v4
        with:
          name: parts-${{ matrix.shard }}
          path: _part_*.mp4
          retention-days: 2

  assemble:
    needs: [probe, render, encode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/download-artifact@v4
        with:
          pattern: parts-*
          merge-multiple: true
          path: _parts

      - name: collect the encoded parts
        run: |
          n=${{ github.event.inputs.shards }}
          mkdir -p _parts_ordered
          for i in $(seq 0 $((n-1))); do
            src=$(find _parts -name "_part_$(printf %02d $i).mp4" | head -1)
            if [ -z "$src" ]; then
              echo "::error::part $i missing"; exit 1
            fi
            cp "$src" "_parts_ordered/_part_$(printf %02d $i).mp4"
          done
          ls -la _parts_ordered

      - name: concat the parts and mux the embedded audio
        run: |
          python encode_episode.py "${{ github.event.inputs.episode }}" \
            --assemble --shards "${{ github.event.inputs.shards }}" \
            --parts _parts_ordered \
            --preset "${{ github.event.inputs.quality }}" \
            --out "RENDER_${{ github.event.inputs.preset }}.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: final-mp4
          path: "RENDER_*.mp4"
          retention-days: 14
