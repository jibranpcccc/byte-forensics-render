name: render-1440p

# Sharded 1440p render. The episode timeline is a pure function of t, so frames
# are independent: job k renders every Nth frame and uploads them as an artifact.
# A final job downloads them, encodes with ffmpeg, muxes the embedded audio
# track, and publishes the MP4.
#
# N shards -> about N times less wall time than one machine.
#
# The shard count comes from the `shards` input and the matrix is GENERATED from
# it, so the runner count can never disagree with the divisor passed to --shard.
# If they disagreed, the assembled video would silently be missing frames.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "episode HTML path"
        required: true
        default: "EPISODES/EP16-FULL.html"
      preset:
        description: "1080p | 1440p | 4k"
        required: true
        default: "1440p"
      shards:
        description: "number of parallel shards"
        required: true
        default: "8"

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      frames: ${{ steps.t.outputs.frames }}
    steps:
      - uses: actions/checkout@v4

      - id: t
        name: read the episode runtime from the embedded TIMING
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          src = open("${{ github.event.inputs.episode }}", encoding="utf-8").read()
          m = re.search(r"const TIMING = /\*__TIMING__\*/(\{.*?\});", src, re.S)
          if not m:
              raise SystemExit("no embedded TIMING -- is the audio attached?")
          total = json.loads(m.group(1))["total"]
          print("frames=%d" % int(round(total * 30)))
          PY

      - id: m
        name: generate the shard matrix from the input
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          n = int("${{ github.event.inputs.shards }}")
          if n < 1 or n > 32:
              raise SystemExit("shards must be 1..32")
          print("matrix=" + json.dumps({"shard": list(range(n))}))
          PY

  render:
    needs: probe
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.probe.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pw-${{ runner.os }}-

      - name: install playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: render shard ${{ matrix.shard }} of ${{ github.event.inputs.shards }}
        run: |
          python render_episode.py "${{ github.event.inputs.episode }}" \
            --preset "${{ github.event.inputs.preset }}" \
            --shard "${{ matrix.shard }}/${{ github.event.inputs.shards }}"

      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.shard }}
          path: _frames_*/
          retention-days: 2

  assemble:
    needs: [probe, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          merge-multiple: true
          path: _frames_all

      - name: check every shard arrived
        run: |
          # Count the JPEGs RECURSIVELY. download-artifact merges the shards into
          # a nested directory, so a plain `ls` counts folders, not frames --
          # which is what made this check report "1" for 17222 rendered frames.
          want=${{ needs.probe.outputs.frames }}
          have=$(find _frames_all -name 'f*.jpg' -type f | wc -l)
          echo "frames present: $have, expected: $want"
          # where did they land?
          find _frames_all -maxdepth 2 -type d | head -20
          if [ "$have" -ne "$want" ]; then
            missing=$((want - have))
            echo "::error::$missing frames missing -- a shard failed or uploaded nothing"
            exit 1
          fi
          # flatten, so ffmpeg sees one sequence and numbering stays global
          mkdir -p _frames_flat
          find _frames_all -name 'f*.jpg' -type f -exec cp {} _frames_flat/ \;
          echo "flattened: $(find _frames_flat -name 'f*.jpg' | wc -l) frames"
          ls _frames_flat | head -3
          ls _frames_flat | tail -3

      - name: encode and mux the embedded audio
        run: |
          python render_episode.py "${{ github.event.inputs.episode }}" \
            --preset "${{ github.event.inputs.preset }}" \
            --outdir _frames_flat --out "RENDER_${{ github.event.inputs.preset }}.mp4" \
            --assemble

      - uses: actions/upload-artifact@v4
        with:
          name: final-mp4
          path: "RENDER_*.mp4"
          retention-days: 14
